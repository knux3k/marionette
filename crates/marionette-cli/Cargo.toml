[package]
name = "marionette-cli"
description = "The marionette command line tool."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "marionette"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[features]
# Optional engine parts, passed to marionette-agent (decision 0062).
default = ["physics", "audio", "anim", "script", "import", "pool", "generate", "port", "jobs-ts", "package", "netplay", "xr", "nav", "gamepad", "starter", "save", "editor"]
# Physics, sound and the synth, skeletal animation (decision 0270).
physics = ["marionette-agent/physics"]
audio = ["marionette-agent/audio"]
anim = ["marionette-agent/anim"]
script = ["marionette-agent/script"]
import = ["marionette-agent/import"]
pool = ["marionette-agent/pool"]
generate = ["marionette-agent/generate", "dep:marionette-generate"]
port = ["marionette-agent/port"]
jobs-ts = ["marionette-agent/jobs-ts"]
package = ["marionette-agent/package", "dep:marionette-package"]
save = ["marionette-agent/save", "dep:marionette-save"]
# Headsets through OpenXR (`marionette xr`; decision 0190). The OpenXR loader is opened at
# run time, so this adds no system dependency.
xr = ["marionette-agent/xr", "dep:marionette-openxr"]
# Controllers in windowed play (decision 0172; Linux builds need libudev).
gamepad = ["dep:marionette-gamepad"]
netplay = ["marionette-agent/netplay"]
starter = ["marionette-agent/starter"]
# World-space UI (off by default; decision 0200).
ui3d = ["marionette-agent/ui3d"]
# Scene editor window (`marionette edit`) and the `editor_view` operation (decision 0130).
editor = ["marionette-agent/editor", "dep:marionette-editor"]
nav = ["marionette-agent/nav"]
# Network transport for paid providers (off by default; decision 0045).
net = ["generate", "marionette-agent/net"]

[dependencies]
glam = "0.34"
marionette-core.workspace = true
marionette-host.workspace = true
marionette-render = { path = "../marionette-render" }
marionette-agent = { path = "../marionette-agent", default-features = false }
marionette-generate = { path = "../marionette-generate", optional = true }
marionette-package = { path = "../marionette-package", optional = true }
marionette-editor = { path = "../marionette-editor", optional = true }
marionette-save = { workspace = true, optional = true }
marionette-openxr = { path = "../marionette-openxr", optional = true }
marionette-gamepad = { path = "../marionette-gamepad", optional = true }
clap.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
marionette-xr = { path = "../marionette-xr" }
marionette-input = { path = "../marionette-input" }
marionette-jobs.workspace = true
marionette-net = { path = "../marionette-net" }
