[package]
name = "marionette-render"
description = "Marionette renderer: wgpu forward PBR for glTF, batched 2D sprites, offscreen capture, optional window."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
marionette-core.workspace = true
bevy_ecs.workspace = true
wgpu = "30.0.1"
winit = "0.30.13"
gltf = { version = "1.4.1", default-features = false, features = ["import", "utils", "names"] }
png = "0.18.1"
bytemuck = { version = "1.25", features = ["derive"] }
glam = "0.34"
pollster = "1.0.1"
serde_json.workspace = true
