name: CI

# Decision 0260: a pull request runs the fast Linux check; the full suite (Windows, stability,
# budgets, valgrind, simulated headset) runs in the merge queue (merge_group) and on main, so
# nothing reaches main without all of it. Pushes to other branches do not run a second copy.
on:
  push:
    branches: [main]
  pull_request:
  merge_group:

concurrency:
  group: ci-${{ github.event.merge_group.head_ref || github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        exclude:
          - os: ${{ github.event_name == 'pull_request' && 'windows-latest' || 'none' }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: System libraries on Linux (ALSA for audio, software Vulkan for GPU tests)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers libasound2-dev libudev-dev pkg-config
      - run: cargo fmt --all -- --check
      - name: Test (GPU tests on lavapipe / WARP, one thread)
        run: cargo test --locked -- --test-threads=1
        env:
          MARIONETTE_REQUIRE_GPU: "1"
          WGPU_BACKEND: ${{ runner.os == 'Windows' && 'dx12' || 'vulkan' }}
          WGPU_ADAPTER_NAME: ${{ runner.os == 'Windows' && 'basic render' || '' }}
      - run: cargo clippy --locked --all-targets -- -D warnings
      - name: Network transport (feature net; local server only, no outside calls)
        run: |
          cargo clippy --locked -p marionette-providers -p marionette-cli --features marionette-providers/net,marionette-cli/net --all-targets -- -D warnings
          cargo test --locked -p marionette-providers --features net --test network
      - name: Lean builds, a game with only the engine parts it uses (decision 0062)
        run: |
          cargo clippy --locked -p marionette-agent -p marionette-cli --no-default-features --all-targets -- -D warnings
          cargo clippy --locked -p marionette-agent -p marionette-cli --no-default-features --features marionette-cli/audio,marionette-cli/xr --all-targets -- -D warnings
          cargo test --locked -p marionette-example-rust-module
          cargo clippy --locked -p marionette-agent -p marionette-cli --features marionette-agent/ui3d,marionette-cli/ui3d --all-targets -- -D warnings
          cargo test --locked -p marionette-agent --features ui3d --test ui3d_ops
          cargo test --locked -p marionette-cli --features ui3d --test skills
      - name: State hash of the example scene
        run: cargo run --locked -q -p marionette-cli -- run examples/drift.scene.json --headless --ticks 1000 --seed 1 --json

  # Stability suite (decision 0031, docs/ai/STABILITY.md), fast length, release build so time
  # budgets are checked. The same suite also runs in debug inside `cargo test` (no timing).
  stability:
    if: github.event_name != 'pull_request'
    name: stability ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: System libraries on Linux (ALSA for audio, software Vulkan for GPU tests)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev mesa-vulkan-drivers
      - name: Stability suite (fast)
        run: cargo run --release --locked -q -p marionette-cli -- stability --out target/stability
        env:
          MARIONETTE_BUDGET_SCALE: "2"
          MARIONETTE_REQUIRE_GPU: "1"
          WGPU_BACKEND: ${{ runner.os == 'Windows' && 'dx12' || 'vulkan' }}
          WGPU_ADAPTER_NAME: ${{ runner.os == 'Windows' && 'basic render' || '' }}
      - name: Keep the stability reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stability-fast-${{ matrix.os }}
          path: target/stability
          if-no-files-found: ignore

  perf:
    if: github.event_name != 'pull_request'
    name: performance budgets (release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Software Vulkan, ALSA headers
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers libasound2-dev libudev-dev
      - name: Timing budgets (decision 0021; docs/ai/PERFORMANCE.md)
        run: cargo test --release --locked -p marionette-example-factory --test perf_budgets -- --ignored --test-threads=1 --nocapture
        env:
          MARIONETTE_REQUIRE_GPU: "1"
          MARIONETTE_BUDGET_SCALE: "2"
          WGPU_BACKEND: vulkan
      - name: Factory benchmark numbers (for the log)
        run: |
          cargo run --release --locked -q -p marionette-example-factory --bin factory-bench -- op perf_factory_scene '{"out":"target/factory4.scene.json","scale":4}'
          cargo run --release --locked -q -p marionette-example-factory --bin factory-bench -- op perf_sim '{"scene":"target/factory4.scene.json","ticks":1200}'

  leaks:
    if: github.event_name != 'pull_request'
    name: leaks (valgrind)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: System libraries (ALSA, valgrind)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev valgrind
      # Decision 0032: the C script runtime (QuickJS) and the crates that own OS resources
      # run under valgrind; any definitely-lost block fails the job. The Rust heap, GPU
      # objects and kill tests run in the normal test job (counting allocator).
      - name: Tests under valgrind
        run: cargo test --locked -p marionette-core -p marionette-host -p marionette-script -- --test-threads=1
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: valgrind --leak-check=full --errors-for-leak-kinds=definite --show-leak-kinds=definite --error-exitcode=9 -q

  # Decision 0190: the OpenXR path end to end on Monado's simulated headset (Xvfb for its
  # compositor window, lavapipe for Vulkan). No real headset: comfort and devices are checked
  # by a person wearing one.
  xr:
    if: github.event_name != 'pull_request'
    name: headset (simulated, OpenXR)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: System libraries (ALSA, Vulkan, OpenXR loader, Monado, Xvfb)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev mesa-vulkan-drivers libopenxr-loader1 monado-service xvfb
      - name: Build
        run: cargo build --locked -p marionette-cli --tests
      - name: Start the simulated headset
        run: |
          Xvfb :99 -screen 0 1280x720x24 &
          sleep 1
          # monado-service watches stdin; keep it open.
          (sleep 3600 | DISPLAY=:99 XRT_COMPOSITOR_FORCE_XCB=1 SIMULATED_ENABLE=1 monado-service > monado.log 2>&1 &)
          # Ready when an OpenXR client can see the headset.
          for i in $(seq 1 90); do
            ./target/debug/marionette xr --probe 2>/dev/null && exit 0
            sleep 2
          done
          exit 1
      - name: XR tests on the runtime
        run: cargo test --locked -p marionette-cli --test xr -- --test-threads=1 --nocapture
        env:
          MARIONETTE_XR_RUNTIME: "1"
          MARIONETTE_REQUIRE_GPU: "1"
          WGPU_BACKEND: vulkan
      - name: Monado log
        if: always()
        run: tail -50 monado.log || true

  # The one check to require on main and in the merge queue. It passes when every job it
  # needs passed or was skipped on purpose (the heavy jobs skip on pull requests).
  gate:
    name: CI gate
    if: always()
    needs: [test, stability, perf, leaks, xr]
    runs-on: ubuntu-latest
    steps:
      - name: All needed jobs passed or were skipped
        run: |
          echo '${{ toJSON(needs) }}' | grep -Eq '"result": "(failure|cancelled)"' && exit 1 || exit 0
