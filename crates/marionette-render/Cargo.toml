[package]
name = "marionette-render"
description = "Marionette renderer: wgpu forward PBR for glTF, batched 2D sprites, offscreen capture, optional window."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
marionette-core.workspace = true
marionette-assets = { path = "../marionette-assets" }
bevy_ecs.workspace = true
wgpu = "30.0.1"
winit = "0.30.13"
bytemuck = { version = "1.25", features = ["derive"] }
glam = "0.34"
pollster = "1.0.1"
serde.workspace = true
serde_json.workspace = true
