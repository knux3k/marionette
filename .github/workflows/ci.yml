name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: System libraries on Linux (ALSA for audio, software Vulkan for GPU tests)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers libasound2-dev pkg-config
      - run: cargo fmt --all -- --check
      - run: cargo build --locked
      - name: Test (GPU tests on lavapipe / WARP, one thread)
        run: cargo test --locked -- --test-threads=1
        env:
          MARIONETTE_REQUIRE_GPU: "1"
          WGPU_BACKEND: ${{ runner.os == 'Windows' && 'dx12' || 'vulkan' }}
          WGPU_ADAPTER_NAME: ${{ runner.os == 'Windows' && 'basic render' || '' }}
      - run: cargo clippy --locked --all-targets -- -D warnings
      - name: Network transport (feature net; local server only, no outside calls)
        run: |
          cargo clippy --locked -p marionette-providers -p marionette-cli --features marionette-providers/net,marionette-cli/net --all-targets -- -D warnings
          cargo test --locked -p marionette-providers --features net --test network
      - name: State hash of the example scene
        run: cargo run --locked -q -p marionette-cli -- run examples/drift.scene.json --headless --ticks 1000 --seed 1 --json

  # Stability suite (decision 0031, docs/ai/STABILITY.md), fast length, release build so time
  # budgets are checked. The same suite also runs in debug inside `cargo test` (no timing).
  stability:
    name: stability ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release
      - name: System libraries on Linux (ALSA for audio, software Vulkan for GPU tests)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev mesa-vulkan-drivers
      - name: Stability suite (fast)
        run: cargo run --release --locked -q -p marionette-cli -- stability --out target/stability
        env:
          MARIONETTE_BUDGET_SCALE: "2"
          MARIONETTE_REQUIRE_GPU: "1"
          WGPU_BACKEND: ${{ runner.os == 'Windows' && 'dx12' || 'vulkan' }}
          WGPU_ADAPTER_NAME: ${{ runner.os == 'Windows' && 'basic render' || '' }}
      - name: Keep the stability reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stability-fast-${{ matrix.os }}
          path: target/stability
          if-no-files-found: ignore

  perf:
    name: performance budgets (release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Software Vulkan, ALSA headers
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers libasound2-dev
      - name: Timing budgets (decision 0021; docs/ai/PERFORMANCE.md)
        run: cargo test --release --locked -p marionette-cli --test perf_budgets -- --ignored --test-threads=1 --nocapture
        env:
          MARIONETTE_REQUIRE_GPU: "1"
          MARIONETTE_BUDGET_SCALE: "2"
          WGPU_BACKEND: vulkan
      - name: Factory benchmark numbers (for the log)
        run: |
          cargo run --release --locked -q -p marionette-cli -- op perf_factory_scene '{"out":"target/factory4.scene.json","scale":4}'
          cargo run --release --locked -q -p marionette-cli -- op perf_sim '{"scene":"target/factory4.scene.json","ticks":1200}'
