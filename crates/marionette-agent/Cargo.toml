[package]
name = "marionette-agent"
description = "The Marionette operation set shared by the CLI and the MCP server: project, edit, run, observe, test."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
marionette-core.workspace = true
marionette-render = { path = "../marionette-render" }
marionette-input = { path = "../marionette-input" }
marionette-physics = { path = "../marionette-physics" }
marionette-audio = { path = "../marionette-audio" }
marionette-import = { path = "../marionette-import" }
marionette-anim = { path = "../marionette-anim" }
marionette-assets = { path = "../marionette-assets" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
schemars = "1.2"
rmcp = { version = "3.9.0", default-features = false, features = ["server", "transport-io"] }
tokio = { version = "1", features = ["rt"] }
