[workspace]
resolver = "3"
members = ["crates/marionette-core", "crates/marionette-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"

[workspace.dependencies]
marionette-core = { path = "crates/marionette-core" }
bevy_ecs = { version = "0.20.1", default-features = false, features = ["std", "bevy_reflect"] }
bevy_reflect = { version = "0.20.1", default-features = false, features = ["std", "reflect_documentation"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
clap = { version = "4.6", features = ["derive"] }

[profile.dev.package."*"]
opt-level = 1
