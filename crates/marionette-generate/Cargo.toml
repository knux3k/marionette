[package]
name = "marionette-generate"
description = "Marionette asset generation: recipes, a cache keyed by request so nothing is paid for twice, provenance records, the image approval gate, and post-processing into engine formats (PNG textures, normalized GLB models)."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
marionette-core.workspace = true
marionette-assets = { path = "../marionette-assets" }
marionette-providers = { path = "../marionette-providers" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
schemars = "1.2"
glam = "0.34"
gltf = { version = "1.4.1", default-features = false, features = ["utils", "names"] }
