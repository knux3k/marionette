[package]
name = "marionette-physics"
description = "Marionette physics: Rapier 3D and 2D behind scene components, stepped in the fixed tick."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
marionette-core.workspace = true
bevy_ecs.workspace = true
bevy_reflect.workspace = true
serde.workspace = true
serde_json.workspace = true
marionette-assets = { path = "../marionette-assets" }
rapier3d = { version = "0.36.1", features = ["enhanced-determinism", "serde-serialize"] }
rapier2d = { version = "0.36.1", features = ["enhanced-determinism", "serde-serialize"] }
postcard = { version = "1.1", features = ["use-std"] }

[lints]
workspace = true
