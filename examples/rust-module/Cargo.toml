[package]
name = "marionette-example-rust-module"
description = "Example game: its own Rust module and operation on top of Marionette, without editing the engine (decision 0062)."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "spring-game"
path = "src/main.rs"

[dependencies]
marionette-core.workspace = true
marionette-host.workspace = true
# Only the parts this game uses: no asset import, pool, generation, porting or job
# TypeScript. Scripts stay on; drop "script" too for a pure Rust game.
marionette-agent = { path = "../../crates/marionette-agent", default-features = false, features = ["script"] }
marionette-cli = { path = "../../crates/marionette-cli", default-features = false, features = ["script"] }
bevy_ecs.workspace = true
bevy_reflect.workspace = true
serde.workspace = true
schemars = "1.2"

[dev-dependencies]
serde_json.workspace = true
