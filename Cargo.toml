[workspace]
resolver = "3"
exclude = ["spikes"]
members = ["crates/marionette-core", "crates/marionette-host", "crates/marionette-package", "crates/marionette-jobs", "crates/marionette-assets", "crates/marionette-render", "crates/marionette-input", "crates/marionette-gamepad", "crates/marionette-physics", "crates/marionette-nav", "crates/marionette-audio", "crates/marionette-synth", "crates/marionette-import", "crates/marionette-pool", "crates/marionette-anim", "crates/marionette-ui3d", "crates/marionette-providers", "crates/marionette-generate", "crates/marionette-script", "crates/marionette-jobs-ts", "crates/marionette-save", "crates/marionette-port", "crates/marionette-starter", "crates/marionette-net", "crates/marionette-platform", "crates/marionette-steam", "crates/marionette-editor", "crates/marionette-agent", "crates/marionette-cli", "examples/rust-module", "examples/factory", "crates/marionette-xr", "crates/marionette-openxr"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"

# Rules every crate that opts in with `[lints] workspace = true` follows (decision 0104).
# `deny`, not `forbid`, so the one test allocator can say `allow`; `repo_hygiene` keeps the list.
# Crates that call C libraries or the OS (cli, host, openxr, render, script, steam) do not opt
# in; `repo_hygiene` lists the only files allowed to hold `unsafe`.
[workspace.lints.rust]
unsafe_code = "deny"

[workspace.dependencies]
marionette-core = { path = "crates/marionette-core" }
marionette-host = { path = "crates/marionette-host" }
marionette-synth = { path = "crates/marionette-synth" }
marionette-jobs = { path = "crates/marionette-jobs" }
marionette-save = { path = "crates/marionette-save" }
bevy_ecs = { version = "0.20.1", default-features = false, features = ["std", "bevy_reflect"] }
bevy_reflect = { version = "0.20.1", default-features = false, features = ["std", "reflect_documentation"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
clap = { version = "4.6", features = ["derive"] }

# Small build cache: line tables only for our code, no debug info for dependencies.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
opt-level = 1

# Shipping builds and benchmarks of record (decision 0101): whole-program optimization. Same
# simulation results and images as `release` (checked by `perf_compare`), 5 to 30 percent less
# CPU time in scripts, physics, game ticks and loading, about twice the build time, so daily
# builds and CI stay on `release`. Panics still unwind (stability tests catch them).
# `cargo build --profile dist -p marionette-cli` -> target/dist/marionette
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
