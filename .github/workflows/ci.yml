name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: System libraries on Linux (ALSA for audio, software Vulkan for GPU tests)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers libasound2-dev pkg-config
      - run: cargo fmt --all -- --check
      - run: cargo build --locked
      - name: Test (GPU tests on lavapipe / WARP, one thread)
        run: cargo test --locked -- --test-threads=1
        env:
          MARIONETTE_REQUIRE_GPU: "1"
          WGPU_BACKEND: ${{ runner.os == 'Windows' && 'dx12' || 'vulkan' }}
          WGPU_ADAPTER_NAME: ${{ runner.os == 'Windows' && 'basic render' || '' }}
      - run: cargo clippy --locked --all-targets -- -D warnings
      - name: State hash of the example scene
        run: cargo run --locked -q -p marionette-cli -- run examples/drift.scene.json --headless --ticks 1000 --seed 1 --json

  leaks:
    name: leaks (valgrind)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: System libraries (ALSA, valgrind)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev valgrind
      # Decision 0029: the C script runtime (QuickJS) and the crates that own OS resources
      # run under valgrind; any definitely-lost block fails the job. The Rust heap, GPU
      # objects and kill tests run in the normal test job (counting allocator).
      - name: Tests under valgrind
        run: cargo test --locked -p marionette-core -p marionette-host -p marionette-script -- --test-threads=1
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: valgrind --leak-check=full --errors-for-leak-kinds=definite --show-leak-kinds=definite --error-exitcode=9 -q
