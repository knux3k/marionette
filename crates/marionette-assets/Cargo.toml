[package]
name = "marionette-assets"
description = "Marionette CPU-side assets: glTF models, PNG images, built-in shapes and images. No GPU."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
glam = "0.34"
gltf = { version = "1.4.1", default-features = false, features = ["import", "utils", "names", "KHR_materials_emissive_strength"] }
png = "0.18.1"
exr = { version = "1.74", default-features = false, optional = true }
intel_tex_2 = { version = "0.5", optional = true }
sha2 = { workspace = true, optional = true }

[features]
default = ["exr"]
# OpenEXR environment images (decision 0091); `.hdr` files need no feature.
exr = ["dep:exr"]
# GPU block compression of model textures (decision 0283): BC7.
compress = ["dep:intel_tex_2", "dep:sha2"]

[dev-dependencies]
marionette-host.workspace = true

[lints]
workspace = true
