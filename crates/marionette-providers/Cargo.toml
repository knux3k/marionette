[package]
name = "marionette-providers"
description = "Marionette AI providers: language, image and 3D interfaces, a deterministic offline mock, Claude, Qwen and Tripo plug-ins, one config file, keys from the environment, a spend cap."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
marionette-core.workspace = true
marionette-assets = { path = "../marionette-assets" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
schemars = "1.2"
ureq = { version = "3.5.1", optional = true, default-features = false, features = ["rustls"] }

[features]
# The network transport (`http::Network`). Off by default: a default build cannot reach any
# paid API (decisions 0019 and 0045).
net = ["dep:ureq"]

[lints]
workspace = true
