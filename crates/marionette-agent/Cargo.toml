[package]
name = "marionette-agent"
description = "The Marionette operation set shared by the CLI and the MCP server: project, edit, run, observe, test."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
marionette-core.workspace = true
marionette-host.workspace = true
marionette-render = { path = "../marionette-render" }
marionette-input = { path = "../marionette-input" }
marionette-physics = { path = "../marionette-physics" }
marionette-audio = { path = "../marionette-audio" }
marionette-synth = { path = "../marionette-synth" }
marionette-import = { path = "../marionette-import", optional = true }
marionette-anim = { path = "../marionette-anim" }
marionette-xr = { path = "../marionette-xr" }
marionette-ui3d = { path = "../marionette-ui3d", optional = true }
bevy_ecs.workspace = true
bevy_reflect.workspace = true
marionette-assets = { path = "../marionette-assets" }
marionette-pool = { path = "../marionette-pool", optional = true }
marionette-factory = { path = "../marionette-factory" }
marionette-jobs.workspace = true
marionette-jobs-ts = { path = "../marionette-jobs-ts", optional = true }
marionette-providers = { path = "../marionette-providers", optional = true }
marionette-generate = { path = "../marionette-generate", optional = true }
marionette-script = { path = "../marionette-script", optional = true }
marionette-port = { path = "../marionette-port", optional = true }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
schemars = "1.2"
rmcp = { version = "3.9.0", default-features = false, features = ["server", "transport-io"] }
tokio = { version = "1", features = ["rt"] }

[features]
# Optional engine parts (decision 0062). A game that does not use one builds without it:
# `default-features = false, features = ["script"]`. Each feature adds its operations (and
# for `script`, the script module).
default = ["script", "import", "pool", "generate", "port", "jobs-ts"]
# TypeScript game scripts (QuickJS and the oxc TypeScript stripper).
script = ["dep:marionette-script"]
# Owned-asset library and prefab import (library_*, prefab_* operations).
import = ["dep:marionette-import"]
# The CC0 asset pool (pool_* operations).
pool = ["import", "generate", "dep:marionette-pool"]
# Image and model generation through providers (generate_*, provider_* operations).
generate = ["dep:marionette-generate", "dep:marionette-providers"]
# Unity and Unreal porting tools (port_* operations).
port = ["dep:marionette-port"]
# Job TypeScript compiled to WebAssembly (wasmtime, jobs_ts_* operations).
jobs-ts = ["dep:marionette-jobs-ts"]
# World-space UI: panels and text placed in the 3D world (ui3d_* operations; decision 0200).
# Off by default: a game that wants it adds the feature or `Ui3dModule` itself.
ui3d = ["dep:marionette-ui3d"]
# Network transport for paid providers (off by default; decision 0045).
net = ["generate", "marionette-providers/net"]
