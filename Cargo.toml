[workspace]
resolver = "3"
exclude = ["spikes"]
members = ["crates/marionette-core", "crates/marionette-host", "crates/marionette-assets", "crates/marionette-render", "crates/marionette-input", "crates/marionette-physics", "crates/marionette-audio", "crates/marionette-import", "crates/marionette-providers", "crates/marionette-script", "crates/marionette-port", "crates/marionette-agent", "crates/marionette-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"

[workspace.dependencies]
marionette-core = { path = "crates/marionette-core" }
marionette-host = { path = "crates/marionette-host" }
bevy_ecs = { version = "0.20.1", default-features = false, features = ["std", "bevy_reflect"] }
bevy_reflect = { version = "0.20.1", default-features = false, features = ["std", "reflect_documentation"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
clap = { version = "4.6", features = ["derive"] }

# Small build cache: line tables only for our code, no debug info for dependencies.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
opt-level = 1
