[package]
name = "marionette-jobs-ts"
description = "Marionette job TypeScript: a typed, numbers-only subset of TypeScript compiled to WebAssembly and run as deterministic data-parallel jobs."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
marionette-core.workspace = true
bevy_ecs.workspace = true
bevy_reflect.workspace = true
marionette-jobs.workspace = true
serde.workspace = true
serde_json.workspace = true
oxc = { version = "0.158" }
wasm-encoder = "0.243"
wasmtime = { version = "48", default-features = false, features = ["cranelift", "runtime", "std"] }
libm = "0.2"
# Safe byte views of number arrays for copies into job memory (no unsafe in this crate).
bytemuck = "1.25"

[dev-dependencies]
marionette-script = { path = "../marionette-script" }
rquickjs = "0.14"
sha2.workspace = true

[lints]
workspace = true
