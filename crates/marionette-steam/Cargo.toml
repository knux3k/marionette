[package]
name = "marionette-steam"
description = "Optional Steam backend for Marionette (networking messages, lobbies, achievements, stats, cloud files). Loads the game's own steam_api library at run time; contains no Steamworks SDK files."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
marionette-net = { path = "../marionette-net" }
marionette-platform = { path = "../marionette-platform" }
libloading = "0.8"

# Calls C libraries or the OS, so `unsafe_code` is not forbidden here; only the files listed in
# `repo_hygiene` may hold `unsafe`, each block with a SAFETY comment (decision 0104).
[lints.rust]
unsafe_code = "allow"
